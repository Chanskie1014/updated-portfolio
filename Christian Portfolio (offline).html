  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

;top:18px;left:50%;transform:translateX(-50%);z-index:80;width:calc(100% - 2*clamp(20px,5.6vw,81px));max-width:1278px}\n.nav-inner{position:relative;display:flex;align-items:center;justify-content:flex-end;gap:16px;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:8px 8px 8px 22px;transition:background .3s ease,border-color .3s ease}\n.nav-links{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:clamp(12px,2.4vw,34px);margin:0;padding:0;list-style:none}\n.nav-links a{font:500 13px/1 inherit;font-family:inherit;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);padding:6px 0;border-bottom:1px solid transparent;transition:color .18s ease,border-color .18s ease}\n.nav-links a:hover,.nav-links a.active{color:var(--text);border-bottom-color:var(--text)}\n.nav-right{display:flex;align-items:center;gap:10px;flex:0 0 auto}\n.btn{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;font:500 13px/1 inherit;font-family:inherit;letter-spacing:.14em;text-transform:uppercase;padding:13px 22px;border:1px solid var(--border);border-radius:999px;background:var(--text);color:var(--bg);cursor:pointer;transition:background .2s ease,color .2s ease}\n.btn:hover{background:var(--bg);color:var(--text)}\n.theme-btn{width:40px;height:40px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:999px;background:transparent;color:var(--text);cursor:pointer;transition:background .2s ease,color .2s ease}\n.theme-btn:hover{background:var(--text);color:var(--bg)}\n.theme-btn svg{width:17px;height:17px}\n[data-theme=\"dark\"] .i-sun{display:none}\nhtml:not([data-theme=\"dark\"]) .i-moon{display:none}\n/* ================= HERO ================= */\n.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;padding-top:0}\n.hero-name{position:absolute;left:0;right:0;bottom:26svh;text-align:left;font-family:\"Anton\",\"Arial Narrow\",Impact,sans-serif;font-size:26.4vw;line-height:1.02;letter-spacing:.015em;white-space:nowrap;pointer-events:none;user-select:none}\n.hero-marquee{display:flex;width:max-content;animation:hero-marquee 34s linear infinite}\n.hero-name.is-solid{pointer-events:auto}\n.hero-name.is-solid:hover .hero-marquee{animation-play-state:paused}\n.hero-marquee > span{padding-right:.03em}\n@keyframes hero-marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}\n.hero-name.is-ghost{color:var(--ghost);bottom:calc(6.2vw + .9vw);left:.6vw;z-index:0}\n.hero-name.is-solid{color:transparent;-webkit-text-stroke:1.6px #000;z-index:1}\n[data-theme=\"dark\"] .hero-name.is-solid{-webkit-text-stroke:1.6px #ffffff}\n.hero-name.is-outline{display:none}\n.hero-portrait{position:relative;z-index:2;height:min(86svh,900px);width:auto;margin:0 auto}\n/* ================= SECTION HEADS ================= */\n.head{position:relative}\n.head .ghost-word{position:absolute;top:0;left:-.03em;font-family:\"Anton\",\"Arial Narrow\",Impact,sans-serif;font-size:clamp(72px,12vw,168px);line-height:.8;letter-spacing:-.01em;color:var(--ghost);white-space:nowrap;pointer-events:none;user-select:none;z-index:0}\n.head h2{position:relative;z-index:1;font-size:clamp(40px,6.1vw,72px)}\n.head .sub{position:relative;z-index:1;margin-top:12px;color:var(--text-2);max-width:62ch}\n.filters{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}\n.chip{display:inline-flex;align-items:center;padding:8px 16px;border:1px solid var(--border);border-radius:999px;background:transparent;color:var(--text);font:500 13px/1 inherit;font-family:inherit;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:background .2s ease,color .2s ease}\n.chip:hover{background:var(--text);color:var(--bg)}\n.chip[aria-pressed=\"true\"]{background:var(--text);color:var(--bg)}\n.is-hidden{display:none!important}\n/* ================= ABOUT ================= */\n.about{display:grid;grid-template-columns:minmax(0,.48fr) minmax(0,.52fr);gap:clamp(28px,4.4vw,64px);align-items:center}\n.about-figure{margin:0;display:flex;justify-content:center;align-items:flex-end}\n.about-figure img{width:100%;max-width:100%;max-height:min(78vh,760px);object-fit:contain;object-position:bottom}\n.about-copy{display:flex;flex-direction:column;gap:26px}\n.about-copy .head{padding-top:0;margin-bottom:40px}\n.about-copy p{color:var(--text-2);text-align:justify;text-justify:inter-word;line-height:1.45}\n.about-copy .btn{align-self:flex-start;margin-top:14px;background:transparent;color:var(--text)}\n.about-copy .btn:hover{background:var(--text);color:var(--bg)}\n/* ================= CARDS (work · services · certifications) ================= */\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(288px,100%),1fr));gap:28px;margin-top:clamp(36px,4.4vw,64px)}\n.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}\n@media (max-width:1060px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media (max-width:560px){.grid-4{grid-template-columns:minmax(0,1fr)}}\n.card{position:relative;display:flex;flex-direction:column;border:1px solid var(--card-border);background:var(--bg);transition:border-color .25s ease,transform .25s ease}\n.card:hover{border-color:var(--card-border-hover);transform:translateY(-3px)}\n/* traveling snake border — reusable on any .snake-card, any size/radius */\n.card-snake{position:absolute;inset:0;width:100%;height:100%;max-width:100%;overflow:hidden;pointer-events:none;z-index:3}\n.card-snake rect{x:0.75px;y:0.75px;width:calc(100% - 1.5px);height:calc(100% - 1.5px);rx:var(--card-radius,0px);ry:var(--card-radius,0px);fill:none;stroke:var(--card-accent);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:13 87;stroke-dashoffset:0;opacity:0;transition:opacity .25s ease}\n.snake-card:hover .card-snake rect{opacity:1;animation:snake-border 2.8s linear infinite}\n@keyframes snake-border{to{stroke-dashoffset:-100}}\n.card-media,.card-body,.cert-body{position:relative;z-index:1}\n.card-media{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;background:var(--surface);border-bottom:1px solid var(--card-border);overflow:hidden}\n.card-media.cert{aspect-ratio:3/2}\n.card-media span{font-family:\"Anton\",\"Arial Narrow\",Impact,sans-serif;font-size:20px;letter-spacing:.06em;color:var(--text-3);opacity:.55}\n.card-media img{width:100%;height:100%;object-fit:cover}\n.card-media.cert img{cursor:zoom-in}\n.cert-lightbox{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:clamp(18px,4vw,56px);background:rgba(0,0,0,.84);opacity:0;pointer-events:none;transition:opacity .22s ease}\n.cert-lightbox.is-open{opacity:1;pointer-events:auto}\n.cert-lightbox img{width:auto;max-width:min(1120px,92vw);max-height:88vh;object-fit:contain;background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.38)}\n.cert-lightbox-close{position:absolute;top:clamp(14px,3vw,28px);right:clamp(14px,3vw,28px);width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.72);border-radius:999px;background:rgba(0,0,0,.2);color:#fff;font:500 18px/1 inherit;cursor:pointer;transition:background .2s ease,color .2s ease}\n.cert-lightbox-close:hover{background:#fff;color:#000}\n@media (max-width:560px){.cert-lightbox{padding:14px}.cert-lightbox-close{width:40px;height:40px}}\n.card-body{display:flex;flex-direction:column;gap:10px;padding:28px}\n.card-body h3{font-size:clamp(22px,2vw,28px)}\n.card-body p{color:var(--text-2);font-size:16px}\n.card-body .tech{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}\n.project-card{cursor:default}\n.project-card .card-media{background:#fff}\n.project-card .card-media img{object-fit:contain}\n.project-card-actions{display:flex;flex-direction:column;align-items:flex-start;gap:14px;margin-top:10px}\n.project-card-link{a ail h4,.project-modal-side h4{margin:0 0 8px;font:500 12px/1 inherit;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3)}\n.project-detail p,.project-modal-side p{color:var(--text-2);font-size:16px;line-height:1.55}\n.project-feature-list{display:grid;gap:8px;margin:0;padding:0;list-style:none;color:var(--text-2);font-size:16px;line-height:1.45}\n.project-feature-list li{position:relative;padding-left:16px}\n.project-feature-list li::before{content:\"\";position:absolute;left:0;top:.68em;width:5px;height:5px;border-radius:999px;background:var(--text-3)}\n.project-modal-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}\n.project-modal-actions .btn[disabled]{opacity:.48;cursor:not-allowed;background:transparent;color:var(--text);border-color:var(--border-soft)}\n.project-modal-actions .btn[disabled]:hover{background:transparent;color:var(--text)}\n@media (max-width:760px){.project-modal{align-items:flex-end;padding:12px}.project-modal-panel{max-height:92vh}.project-modal-body{grid-template-columns:minmax(0,1fr);padding:24px}.project-modal-close{top:12px;right:12px}.project-modal h3{font-size:34px}}\n/* services auto-scroll */\n.svc-marquee{margin-top:clamp(36px,4.4vw,64px);overflow:hidden}\n.svc-track{display:flex;width:max-content;gap:28px;animation:svc-scroll 34s linear infinite}\n.svc-marquee:hover .svc-track{animation-play-state:paused}\n.svc-track .card{flex:0 0 auto;width:clamp(280px,31vw,392px)}\n@keyframes svc-scroll{from{transform:translateX(0)}to{transform:translateX(calc(-50% - 14px))}}\n@media (max-width:560px){.svc-track .card{width:78vw}}\n/* ================= TOOLS ================= */\n.tools{display:flex;flex-wrap:wrap;gap:10px;margin:clamp(36px,4.4vw,64px) 0 0;padding:0;list-style:none}\n.tools li{position:relative;width:88px;height:88px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border-soft);border-radius:8px;transition:border-color .25s ease,background .25s ease,transform .25s ease;outline:none}\n.tools li:hover{border-color:var(--border);transform:scale(1.02)}\n.tools li:focus-visible{border-color:var(--border);transform:scale(1.02)}\n.tools li:focus-within{border-color:var(--border);transform:scale(1.02)}\n.tools img{height:40px;width:auto;filter:grayscale(100%);opacity:.72;transition:filter .25s ease,opacity .25s ease,transform .25s ease}\n[data-theme=\"dark\"] .tools img{opacity:.8}\n.tools li:hover img{filter:grayscale(0%);opacity:1;transform:translateY(-1px)}\n.tools li:focus-visible img{filter:grayscale(0%);opacity:1;transform:translateY(-1px)}\n.tools li:focus-within img{filter:grayscale(0%);opacity:1;transform:translateY(-1px)}\n.tools span{display:none;position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,0);max-width:min(220px,64vw);padding:5px 9px;background:var(--text);color:var(--bg);font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:2px;pointer-events:none;z-index:5;animation:tip-in .2s ease both}\n@keyframes tip-in{from{opacity:0;transform:translate(-50%,4px)}to{opacity:1;transform:translate(-50%,0)}}\n.tools li:hover span{display:block}\n.tools li:focus-visible span{display:block}\n.tools li:focus-within span{display:block}\n/* ================= DISCOVERY CALL ================= */\n.call{display:grid;grid-template-columns:minmax(0,.45fr) minmax(0,.55fr);gap:clamp(28px,5.6vw,81px);align-items:start;margin-top:clamp(36px,4.4vw,64px)}\n.call p{color:var(--text-2);max-width:46ch}\n.call .head{margin-bottom:26px}\n.call .head .sub{margin-top:12px}\n.calendly{border:1px solid var(--border);background:var(--surface);padding:0;overflow:hidden}\n.calendly{position:relative}\n.calendly .calendly-inline-widget{width:100%;height:560px}\n.calendly .calendly-inline-widget iframe{display:block}\n@media (max-width:1060px){.calendly .calendly-inline-widget{height:620px}}\n@media (max-width:560px){.calendly .calendly-inline-widget{height:660px}}\n.calendly span{font-family:\"Anton\",\"Arial Narrow\",Impact,sans-serif;font-size:clamp(28px,3.4vw,52px);line-height:.96;letter-spacing:.01em;text-transform:uppercase;color:var(--text-3);opacity:.5}\n/* ================= CONTACT ================= */\n.contact-block{margin-top:clamp(48px,6vw,88px);scroll-margin-top:100px}\n.contact-copy{margin-top:28px;display:flex;flex-direction:column;gap:6px}\n.contact-copy p{font-size:clamp(19px,2.2vw,26px);line-height:1.35;max-width:36ch}\n.socials{display:flex;flex-wrap:wrap;gap:16px;margin-top:40px}\n.social{width:56px;height:56px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:999px;transition:background .2s ease,transform .2s ease}\n.social img{width:24px;height:24px;object-fit:contain;filter:grayscale(1);opacity:.85;transition:filter .2s ease}\n[data-theme=\"dark\"] .social img{filter:grayscale(1) invert(1)}\n.social:hover{background:var(--text);transform:translateY(-2px)}\n.social:hover img{filter:grayscale(1) invert(1)}\n[data-theme=\"dark\"] .social:hover img{filter:grayscale(1) invert(0)}\n/* ================= FOOTER ================= */\nfooter{margin-top:clamp(88px,10vw,140px);border-top:1px solid var(--border-soft)}\n.footer-inner{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:16px 28px;padding-top:40px;padding-bottom:40px}\n.footer-name{font-family:\"Anton\",\"Arial Narrow\",Impact,sans-serif;font-size:26px}\n.footer-copy{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}\n/* back to top */\n.to-top{position:fixed;right:clamp(16px,3vw,32px);bottom:clamp(16px,3vw,32px);z-index:70;width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:999px;background:var(--text);color:var(--bg);cursor:pointer;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .25s ease,transform .25s ease,background .2s ease,color .2s ease}\n.to-top.is-visible{opacity:1;transform:none;pointer-events:auto}\n.to-top:hover{background:var(--bg);color:var(--text)}\n.to-top svg{width:18px;height:18px}\n@media (max-width:560px){.to-top{width:42px;height:42px}}\n/* ================= REVEAL ================= */\n.reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}\n.reveal.in{opacity:1;transform:none}\n/* scroll-linked hero exit */\n.hero-name,.hero-portrait{will-change:transform,opacity}\n/* staggered about entrance */\n.about-figure.reveal{transform:translateY(28px)}\n.about-copy.reveal{opacity:1;transform:none;transition:none}\n.about-copy > *{opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s ease}\n.about-copy.in > *{opacity:1;transform:none}\n.about-copy.in > *:nth-child(1){transition-delay:.06s}\n.about-copy.in > *:nth-child(2){transition-delay:.14s}\n.about-copy.in > *:nth-child(3){transition-delay:.20s}\n.about-copy.in > *:nth-child(4){transition-delay:.26s}\n.about-copy.in > *:nth-child(5){transition-delay:.32s}\n.about-copy.in > *:nth-child(6){transition-delay:.38s}\n.about-copy.in > *:nth-child(7){transition-delay:.44s}\n@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}.about-copy > *{opacity:1;transform:none;transition:none}.hero-name,.hero-portrait{transform:none!important;opacity:1!important}.hero-marquee{animation:none}.svc-track{animation:none;flex-wrap:wrap}.card-snake rect{animation:none!important;stroke-dasharray:none}.snake-card:hover .card-snake rect{opacity:1}.card:hover,.card:focus-within{transform:none}}\n/* ================= RESPONSIVE ================= */\n@media (max-width:1060px){\n  .about,.call{grid-template-columns:minmax(0,1fr)}\n  .about-figure{max-width:520px}\n}\n@media (max-width:1100px){\n  .nav-inner{justify-content:space-between}\n  .nav-links{position:static;left:auto;transform:none}\n}\n@media (max-wi imary_color=8a8a8a\";\n    host.innerHTML = \"\";\n    window.Calendly.initInlineWidget({ url: CAL_URL + \"?\" + q, parentElement: host });\n  }\n  /* widget.js is loaded here (not as a markup <script src>) so a blocked or\n     offline request fails quietly instead of raising a page-level error */\n  (function loadCalendly() {\n    var host = document.getElementById(\"calendly-embed\");\n    var online = location.protocol === \"http:\" || location.protocol === \"https:\";\n    if (!host) { return; }\n    if (!online) {\n      /* opened straight from disk (file://) — the widget cannot work, so hide the box */\n      var offBox = document.getElementById(\"calendly-container\");\n      if (offBox) { offBox.style.display = \"none\"; }\n      return;\n    }\n    var s = document.createElement(\"script\");\n    s.src = \"https://assets.calendly.com/assets/external/widget.js\";\n    s.async = true;\n    s.onload = function () { mountCalendly(); };\n    s.onerror = function () {\n      var box = document.getElementById(\"calendly-container\");\n      if (box) { box.style.display = \"none\"; }\n    };\n    document.head.appendChild(s);\n  })();\n\n  document.getElementById(\"year\").textContent = new Date().getFullYear();\n\n  /* ---------- smooth scroll, offset for the fixed nav ---------- */\n  document.querySelectorAll('a[href^=\"#\"]').forEach(function (link) {\n    link.addEventListener(\"click\", function (ev) {\n      var id = link.getAttribute(\"href\");\n      if (!id || id === \"#\") { return; }\n      var target = document.querySelector(id);\n      if (!target) { return; }\n      ev.preventDefault();\n      var y = target.getBoundingClientRect().top + window.pageYOffset - 86;\n      window.scrollTo({ top: y < 0 ? 0 : y, behavior: \"smooth\" });\n      history.replaceState(null, \"\", id);\n    });\n  });\n\n  /* ---------- subtle reveal on scroll ---------- */\n  var items = document.querySelectorAll(\".reveal\");\n  if (\"IntersectionObserver\" in window) {\n    var io = new IntersectionObserver(function (entries) {\n      entries.forEach(function (entry) {\n        if (entry.isIntersecting) { entry.target.classList.add(\"in\"); io.unobserve(entry.target); }\n      });\n    }, { rootMargin: \"0px 0px -8% 0px\", threshold: 0.08 });\n    items.forEach(function (el) { io.observe(el); });\n  } else {\n    items.forEach(function (el) { el.classList.add(\"in\"); });\n  }\n\n  /* ---------- project details modal ---------- */\n  var AQUATRACK_URL = \"https://aquatrack.page.gd/\";\n  var GRACE_IN_QUIET_URL = \"https://graceinthequiet.page.gd/\";\n  var MINIMALIST_PORTFOLIO_URL = \"https://cjie-trabado.page.gd/\";\n  var projectDetails = {\n    aquatrack: {\n      category: \"FISH PORT MANAGEMENT & MARKETPLACE\",\n      title: \"AquaTrack\",\n      image: \"aquatrack.jpg\",\n      imageAlt: \"AquaTrack project screenshot\",\n      description: \"A web-based system designed to improve fish record management, online fish trading, reservations, reporting, and forecasting for Panabo City Fish Port.\",\n      problem: \"Fish records, marketplace transactions, and monitoring activities needed a centralized digital system for more efficient management and decision-making.\",\n      done: \"Developed a centralized platform with fish record management, vendor and buyer marketplace features, reservations, dashboards, reports, origin mapping, and fish forecasting.\",\n      technologies: \"PHP · MySQL · Tailwind CSS · JavaScript · Chart.js · Leaflet.js\",\n      role: \"Full-Stack Developer / System Developer\",\n      type: \"Capstone Project\",\n      url: AQUATRACK_URL\n    },\n    graceInQuiet: {\n      category: \"CHRISTIAN CBT · HEALING & JOURNALING COMMUNITY\",\n      title: \"Grace in the Quiet\",\n      image: \"graceinthequiet.jpg\",\n      imageAlt: \"Grace in the Quiet project screenshot\",\n      description: \"A faith-rooted website and custom CMS designed to provide healing resources, Christian CBT coaching, prayer support, journaling content, events, and community services.\",\n      problem: \"The website needed a centralized content management system that would allow the site owner to manage website content, community requests, bookings, resources, events, and donation information without modifying code.\",\n      done: \"Developed a custom PHP + MySQL CMS with secure admin authentication, content management modules, booking and inquiry management, prayer requests, testimonials, donation settings, site configuration, and dynamic frontend content.\",\n      features: [\"Blog & Category Management\", \"Resource & File Management\", \"Event Management\", \"Service Management\", \"Prayer Request Management\", \"Booking & Inquiry Management\", \"Testimonials Management\", \"Donation & GCash/PayPal Settings\", \"Site Settings & Content Management\", \"Admin Dashboard\"],\n      technologies: \"PHP 8+ · MySQL · PDO · Tailwind CSS · JavaScript\",\n      role: \"Full-Stack Developer / System Developer\",\n      type: \"Website + Custom CMS\",\n      status: \"90-95% Complete\",\n      url: GRACE_IN_QUIET_URL\n    },\n    minimalistPortfolio: {\n      category: \"PERSONAL PORTFOLIO WEBSITE\",\n      title: \"Minimalist Portfolio\",\n      image: \"minimalist portfolio.jpg\",\n      imageAlt: \"Minimalist Portfolio project screenshot\",\n      description: \"A clean, responsive portfolio website built with a minimalist design approach to present a client's professional profile, experience, skills, and projects.\",\n      problem: \"The client needed a simple and professional online presence that could clearly showcase their background and work without unnecessary visual clutter.\",\n      done: \"Designed and developed a responsive minimalist portfolio with a structured profile section, experience timeline, project showcase, and responsive layouts for different screen sizes.\",\n      features: [\"Minimalist & Clean UI\", \"Responsive Design\", \"Profile / About Section\", \"Experience Timeline\", \"Skills & Expertise\", \"Project Showcase\", \"Mobile-Friendly Layout\"],\n      technologies: \"HTML · CSS · JavaScript\",\n      role: \"Web Developer / UI Designer\",\n      type: \"Client Project\",\n      status: \"Completed\",\n      url: MINIMALIST_PORTFOLIO_URL\n    }\n  };\n  var projectModal = null;\n  var projectModalPanel = null;\n  var projectModalLastFocus = null;\n  var projectModalPreviousOverflow = \"\";\n\n  function closeProjectModal() {\n    if (!projectModal) { return; }\n    projectModal.classList.remove(\"is-open\");\n    document.body.style.overflow = projectModalPreviousOverflow;\n    if (projectModalLastFocus && typeof projectModalLastFocus.focus === \"function\") { projectModalLastFocus.focus(); }\n  }\n\n  function renderProjectModal(project) {\n    var visit = project.url\n      ? '<a class=\"btn\" href=\"' + project.url + '\" target=\"_blank\" rel=\"noopener noreferrer\">Visit Site<\\/a>'\n      : '<button class=\"btn\" type=\"button\" disabled aria-disabled=\"true\">Visit Site<\\/button>';\n    var features = project.features && project.features.length\n      ? '<div class=\"project-detail\"><h4>Key Features<\\/h4><ul class=\"project-feature-list\">' + project.features.map(function (feature) { return '<li>' + feature + '<\\/li>'; }).join('') + '<\\/ul><\\/div>'\n      : '';\n    var status = project.status\n      ? '    <div><h4>Status<\\/h4><p>' + project.status + '<\\/p><\\/div>'\n      : '';\n\n    projectModalPanel.innerHTML = ''\n      + '<button class=\"project-modal-close\" type=\"button\" aria-label=\"Close project details\">X<\\/button>'\n      + '<div class=\"project-modal-media\"><img src=\"' + project.image + '\" alt=\"' + project.imageAlt + '\"><\\/div>'\n      + '<div class=\"project-modal-body\">'\n      + '  <div class=\"project-modal-main\">'\n      + '    <div><p class=\"project-kicker\">' + project.category + '<\\/p><h3>' + project.title + '<\\/h3><\\/div>'\n      + '    <div class=\"project-detail\"><h4>Description<\\/h4><p>' + project.description + '<\\/p><\\/div>'\n      + '    <div class=\"project-detail\"><h4>Problem Needed Solving<\\/h4><p>' + project.problem + '<\\/p><\\/div>'\n      + '    <div class=\"project-detail\"><h4>What Was Done<\\/h4><p>' + project.done + '<\\/p><\\/div>'\n      + features\n      + '    <div class=\"project-modal-actions\">' + visit + '<\\/div>'\n      + '  <\\/div>'\n      + '  <aside class=\"project-modal-side\">'\n      + '    <div><h4>Technologies<\\/h4><p>' + project.technologies + '<\\/p><\\/div>'\n      + '    <div><h4>Role<\\/h4><p>' + project.role + '<\\/p><\\/div>'\n      + '    <div><h4>Project Type<\\/h4><p>' + project.type + '<\\/p><\\/div>'\n      + status\n      + '  <\\/aside>'\n      + '<\\/div>';\n\n    projectModalPanel.querySelector(\".project-modal-close\").addEventListener(\"click\", closeProjectModal);\n  }\n\n  function ensureProjectModal() {\n    if (projectModal) { return; }\n    projectModal = document.createElement(\"div\");\n    projectModal.className = \"project-modal\";\n    projectModal.setAttribute(\"role\", \"dialog\");\n    projectModal.setAttribute(\"aria-modal\", \"true\");\n    projectModal.setAttribute(\"aria-label\", \"Project details\");\n    projectModalPanel = document.createElement(\"div\");\n    projectModalPanel.className = \"project-modal-panel\";\n    projectModalPanel.setAttribute(\"tabindex\", \"-1\");\n    projectModal.appendChild(projectModalPanel);\n    document.body.appendChild(projectModal);\n    projectModal.addEventListener(\"click\", function (ev) {\n      if (ev.target === projectModal) { closeProjectModal(); }\n    });\n    document.addEventListener(\"keydown\", function (ev) {\n      if (ev.key === \"Escape\" && projectModal.classList.contains(\"is-open\")) { closeProjectModal(); }\n    });\n  }\n\n  function openProjectModal(id) {\n    var project = projectDetails[id];\n    if (!project) { return; }\n    ensureProjectModal();\n    projectModalLastFocus = document.activeElement;\n    projectModalPreviousOverflow = document.body.style.overflow;\n    renderProjectModal(project);\n    projectModal.classList.add(\"is-open\");\n    document.body.style.overflow = \"hidden\";\n    projectModalPanel.focus();\n  }\n\n  document.querySelectorAll(\"[data-project-open]\").forEach(function (button) {\n    var projectId = button.getAttribute(\"data-project-open\");\n    if (!projectDetails[projectId]) { return; }\n    button.addEventListener(\"click\", function (ev) {\n      ev.stopPropagation();\n      openProjectModal(projectId);\n    });\n  });\n\n  /* ---------- certificate zoom ---------- */\n  var certLightbox = null;\n  var certLightboxImg = null;\n  function closeCertLightbox() {\n    if (certLightbox) { certLightbox.classList.remove(\"is-open\"); }\n    document.body.style.overflow = \"\";\n  }\n  function openCertLightbox(src, alt) {\n    if (!certLightbox) {\n      certLightbox = document.createElement(\"div\");\n      certLightbox.className = \"cert-lightbox\";\n      certLightbox.setAttribute(\"role\", \"dialog\");\n      certLightbox.setAttribute(\"aria-modal\", \"true\");\n      certLightbox.setAttribute(\"aria-label\", \"Certificate preview\");\n\n      var closeBtn = document.createElement(\"button\");\n      closeBtn.className = \"cert-lightbox-close\";\n      closeBtn.type = \"button\";\n      closeBtn.setAttribute(\"aria-label\", \"Close certificate preview\");\n      closeBtn.textContent = \"X\";\n\n      certLightboxImg = document.createElement(\"img\");\n      certLightbox.appendChild(certLightboxImg);\n      certLightbox.appendChild(closeBtn);\n      document.body.appendChild(certLightbox);\n\n      closeBtn.addEventListener(\"click\", closeCertLightbox);\n      certLightbox.addEventListener(\"click\", function (ev) {\n        if (ev.target === certLightbox) { closeCertLightbox(); }\n      });\n      document.addEventListener(\"keydown\", function (ev) {\n        if (ev.key === \"Escape\") { closeCertLightbox(); }\n      });\n    }\n\n    certLightboxImg.src = src;\n    certLightboxImg.alt = alt || \"Certificate preview\";\n    certLightbox.classList.add(\"is-open\");\n    document.body.style.overflow = \"hidden\";\n  }\n  document.querySelectorAll(\".card-media.cert img\").forEach(function (img) {\n    img.setAttribute(\"tabindex\", \"0\");\n    img.setAttribute(\"role\", \"button\");\n    img.setAttribute(\"aria-label\", \"Open certificate preview\");\n    img.addEventListener(\"click\", function () { openCertLightbox(img.currentSrc || img.src, img.alt); });\n    img.addEventListener(\"keydown\", function (ev) {\n      if (ev.key === \"Enter\" || ev.key === \" \") {\n        ev.preventDefault();\n        openCertLightbox(img.currentSrc || img.src, img.alt);\n      }\n    });\n  });\n\n  /* ---------- back to top ---------- */\n  var toTop = document.getElementById(\"to-top\");\n  toTop.addEventListener(\"click\", function () { window.scrollTo({ top: 0, behavior: \"smooth\" }); });\n  var toTopQueued = false;\n  function syncToTop() {\n    toTopQueued = false;\n    toTop.classList.toggle(\"is-visible\", window.pageYOffset > 600);\n  }\n  window.addEventListener(\"scroll\", function () {\n    if (!toTopQueued) { toTopQueued = true; window.requestAnimationFrame(syncToTop); }\n  }, { passive: true });\n  syncToTop();\n\n  /* ---------- category filters ---------- */\n  document.querySelectorAll(\"[data-filter-group]\").forEach(function (group) {\n    var name = group.getAttribute(\"data-filter-group\");\n    var target = document.querySelector('[data-filter-target=\"' + name + '\"]');\n    if (!target) { return; }\n    var items = Array.prototype.slice.call(target.children);\n    group.addEventListener(\"click\", function (ev) {\n      var chip = ev.target.closest(\".chip\");\n      if (!chip) { return; }\n      var pick = chip.getAttribute(\"data-filter\");\n      group.querySelectorAll(\".chip\").forEach(function (c) { c.setAttribute(\"aria-pressed\", String(c === chip)); });\n      items.forEach(function (item) {\n        var show = pick === \"all\" || item.getAttribute(\"data-cat\") === pick;\n        item.classList.toggle(\"is-hidden\", !show);\n        if (show) { item.classList.add(\"in\"); }\n      });\n    });\n  });\n\n  /* ---------- scroll-linked hero exit ---------- */\n  var reduce = window.matchMedia && window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n  if (!reduce) {\n    var hero = document.getElementById(\"top\");\n    var heroName = document.querySelector(\".hero-name\");\n    var heroImg = document.querySelector(\".hero-portrait\");\n    var queued = false;\n    var paint = function () {\n      queued = false;\n      var h = hero.offsetHeight || 1;\n      var p = Math.min(1, Math.max(0, window.pageYOffset / h));\n      var e = p * p * (3 - 2 * p); /* smoothstep */\n      heroName.style.transform = \"translateY(\" + (-110 * e).toFixed(2) + \"px)\";\n      heroName.style.opacity = String(Math.max(0, 1 - e * 1.25));\n      heroImg.style.transform = \"translateY(\" + (-46 * e).toFixed(2) + \"px)\";\n      heroImg.style.opacity = String(Math.max(0, 1 - e * 0.9));\n    };\n    var onScroll = function () { if (!queued) { queued = true; window.requestAnimationFrame(paint); } };\n    window.addEventListener(\"scroll\", onScroll, { passive: true });\n    window.addEventListener(\"resize\", onScroll, { passive: true });\n    paint();\n  }\n\n  /* ---------- active nav item ---------- */\n  var links = Array.prototype.slice.call(document.querySelectorAll(\".nav-links a\"));\n  var sections = links.map(function (l) { return document.querySelector(l.getAttribute(\"href\")); });\n  if (\"IntersectionObserver\" in window) {\n    var spy = new IntersectionObserver(function (entries) {\n      entries.forEach(function (entry) {\n        if (!entry.isIntersecting) { return; }\n        links.forEach(function (l, i) { l.classList.toggle(\"active\", sections[i] === entry.target); });\n      });\n    }, { rootMargin: \"-40% 0px -55% 0px\" });\n    sections.forEach(function (s) { if (s) { spy.observe(s); } });\n  }\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
